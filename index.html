        try {

      function saveState() {
        saveLocalOnly();

          try {

              adminCoins: state.adminCoins,
              adminCreds: state.adminCreds

            state.matches.forEach(m => {
              db.collection('sa_matches').doc(m.id).set(m, { merge: true }).catch(() => {});
            });

      function initFirebase(config) {
        if (!config || !config.apiKey || !config.projectId || typeof firebase === 'undefined') {

          return false;

        try {
          if (!firebase.apps.length) {
            firebase.initializeApp(config);
          }
          db = firebase.firestore();
          fbConnected = true;
          startFirestoreSync();
          return true;
        } catch (e) {
          fbConnected = false;
          return false;
        }

        if (!db) return;

        if (unsubUsers) unsubUsers();
        if (unsubRequests) unsubRequests();
        if (unsubMeta) unsubMeta();

        unsubMatches = db.collection('sa_matches').onSnapshot((snap) => {
          const list = [];
          snap.forEach(doc => list.push(doc.data()));
          if (list.length > 0) {
            list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            state.matches = list;
            saveLocalOnly();
            render();
          }
        }, () => {});

          const list = [];

          if (list.length > 0) {
            state.users = list;
            saveLocalOnly();
            render();
          }
        }, () => {});

          list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          state.coinRequests = list;
          saveLocalOnly();
          render();
        }, () => {});

            const d = doc.data();
            if (typeof d.adminCoins === 'number') state.adminCoins = d.adminCoins;
            if (d.adminCreds) state.adminCreds = d.adminCreds;
            saveLocalOnly();
            render();

        const colors = {

          error: 'bg-rose-600/95 border-rose-400/40 text-white',
          info: 'bg-slate-800/95 border-orange-500/40 text-slate-100'
        };
        const toast = document.createElement('div');
        toast.className = `pointer-events-auto px-4 py-3 rounded-xl border shadow-2xl text-sm font-medium flex items-center gap-2 transition-all duration-300 ${colors[type || 'info']}`;
        toast.textContent = message;
        toastContainer.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(8px)';
          setTimeout(() => toast.remove(), 300);

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')

      function copyText(text, label) {
        if (!text) return;
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          showToast(`${label} copied: ${text}`, 'success');
        } catch (e) {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(
              () => showToast(`${label} copied: ${text}`, 'success'),
              () => showToast('Copy failed', 'error')
            );
          } else {
            showToast('Copy failed', 'error');
          }
        }
      }
